plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kioku'
version = '0.0.1-SNAPSHOT'
description = 'Backend API for Kioku flashcard application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    jvmArgs(
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Xshare:off'
    )

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

// Development Tasks
tasks.register('dockerDevClean', Exec) {
    group = 'docker'
    description = 'Start development environment with clean slate (removes volumes for fresh database)'
    workingDir projectDir
    commandLine 'bash', '-c',
            'docker-compose -f docker-compose.dev.yml down -v && ' +
                    'docker-compose -f docker-compose.dev.yml up --build --force-recreate'
}

tasks.register('dockerDevQuick', Exec) {
    group = 'docker'
    description = 'Start development environment (preserves database)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build'
}

tasks.register('dockerDevDetached', Exec) {
    group = 'docker'
    description = 'Start development environment in background'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build', '-d'
}

// Production Tasks
tasks.register('dockerProdClean', Exec) {
    group = 'docker'
    description = 'Start production environment with clean slate (removes volumes for fresh database)'
    workingDir projectDir
    commandLine 'bash', '-c',
            'docker-compose -f docker-compose.yml down -v && ' +
                    'docker-compose -f docker-compose.yml up --build --force-recreate'
}

tasks.register('dockerProdQuick', Exec) {
    group = 'docker'
    description = 'Start production environment (preserves database)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'up', '--build'
}

tasks.register('dockerProdDetached', Exec) {
    group = 'docker'
    description = 'Start production environment in background'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'up', '--build', '-d'
}

// Control Tasks
tasks.register('dockerDown', Exec) {
    group = 'docker'
    description = 'Stop all development containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down'
}

tasks.register('dockerDownProd', Exec) {
    group = 'docker'
    description = 'Stop all production containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'down'
}

tasks.register('dockerDownAll', Exec) {
    group = 'docker'
    description = 'Stop all containers (dev and prod)'
    workingDir projectDir
    commandLine 'bash', '-c',
            'docker-compose -f docker-compose.dev.yml down; ' +
                    'docker-compose -f docker-compose.yml down'
}

tasks.register('dockerDownVolumes', Exec) {
    group = 'docker'
    description = 'Stop development containers and remove volumes'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down', '-v'
}

tasks.register('dockerDownAllVolumes', Exec) {
    group = 'docker'
    description = 'Stop all containers and remove all volumes'
    workingDir projectDir
    commandLine 'bash', '-c',
            'docker-compose -f docker-compose.dev.yml down -v; ' +
                    'docker-compose -f docker-compose.yml down -v'
}

// Utility Tasks
tasks.register('dockerLogs', Exec) {
    group = 'docker'
    description = 'Show development container logs (follow mode)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'logs', '-f'
}

tasks.register('dockerLogsProd', Exec) {
    group = 'docker'
    description = 'Show production container logs (follow mode)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'logs', '-f'
}

tasks.register('dockerPs', Exec) {
    group = 'docker'
    description = 'Show running containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'ps'
}

tasks.register('dockerRestart', Exec) {
    group = 'docker'
    description = 'Restart development containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'restart'
}

tasks.register('dockerRebuild', Exec) {
    group = 'docker'
    description = 'Rebuild development images without cache'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'build', '--no-cache'
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Run all tests with Testcontainers (one command)'
    dependsOn test
}

tasks.named('test') {
    useJUnitPlatform()

    // Show test results
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}