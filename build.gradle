plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kioku'
version = '0.0.1-SNAPSHOT'
description = 'Backend API for Kioku flashcard application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Jackson ObjectMapper
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    jvmArgs(
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Xshare:off'
    )

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

// Docker Tasks
tasks.register('dockerUp', Exec) {
    group = 'docker'
    description = 'Start local development environment (preserves database)'
    workingDir projectDir
    commandLine 'docker-compose', 'up', '--build'
}

tasks.register('dockerUpDetached', Exec) {
    group = 'docker'
    description = 'Start local development environment in background'
    workingDir projectDir
    commandLine 'docker-compose', 'up', '--build', '-d'
}

tasks.register('dockerDown', Exec) {
    group = 'docker'
    description = 'Stop containers'
    workingDir projectDir
    commandLine 'docker-compose', 'down'
}

tasks.register('dockerClean', Exec) {
    group = 'docker'
    description = 'Stop containers and remove volumes (fresh database)'
    workingDir projectDir
    commandLine 'docker-compose', 'down', '-v'
}

tasks.register('dockerLogs', Exec) {
    group = 'docker'
    description = 'Show container logs (follow mode)'
    workingDir projectDir
    commandLine 'docker-compose', 'logs', '-f'
}

tasks.register('dockerPs', Exec) {
    group = 'docker'
    description = 'Show running containers'
    workingDir projectDir
    commandLine 'docker-compose', 'ps'
}

tasks.register('dockerRestart', Exec) {
    group = 'docker'
    description = 'Restart containers'
    workingDir projectDir
    commandLine 'docker-compose', 'restart'
}

// Docker Dev Tasks
tasks.register('dockerDevUp', Exec) {
    group = 'docker-dev'
    description = 'Start dev environment with debug logging (preserves database)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build'
}

tasks.register('dockerDevUpDetached', Exec) {
    group = 'docker-dev'
    description = 'Start dev environment in background'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build', '-d'
}

tasks.register('dockerDevDown', Exec) {
    group = 'docker-dev'
    description = 'Stop dev containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down'
}

tasks.register('dockerDevClean', Exec) {
    group = 'docker-dev'
    description = 'Stop dev containers and remove volumes (fresh database)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down', '-v'
}

tasks.register('dockerDevLogs', Exec) {
    group = 'docker-dev'
    description = 'Show dev container logs (follow mode)'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'logs', '-f'
}

tasks.register('dockerDevPs', Exec) {
    group = 'docker-dev'
    description = 'Show running dev containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'ps'
}

tasks.register('dockerDevRestart', Exec) {
    group = 'docker-dev'
    description = 'Restart dev containers'
    workingDir projectDir
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'restart'
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Run all tests with Testcontainers (one command)'
    dependsOn test
}

tasks.named('test') {
    useJUnitPlatform()

    // Show test results
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}