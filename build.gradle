plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kioku'
version = '0.0.1-SNAPSHOT'
description = 'Backend API for Kioku flashcard application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Docker Compose Tasks
tasks.register('dockerDevClean', Exec) {
    group = 'docker'
    description = 'Start development environment with clean slate'
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build', '--force-recreate', '--renew-anon-volumes'
}

tasks.register('dockerDevQuick', Exec) {
    group = 'docker'
    description = 'Start development environment (preserves data)'
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'up', '--build'
}

tasks.register('dockerProdClean', Exec) {
    group = 'docker'
    description = 'Start production environment with clean slate'
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'up', '--build', '--force-recreate', '--renew-anon-volumes'
}

tasks.register('dockerProdQuick', Exec) {
    group = 'docker'
    description = 'Start production environment (preserves data)'
    commandLine 'docker-compose', '-f', 'docker-compose.yml', 'up', '--build'
}

tasks.register('dockerDown', Exec) {
    group = 'docker'
    description = 'Stop all Docker containers'
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down'
}

tasks.register('dockerDownVolumes', Exec) {
    group = 'docker'
    description = 'Stop all Docker containers and remove volumes'
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'down', '-v'
}

tasks.register('dockerLogs', Exec) {
    group = 'docker'
    description = 'Show Docker container logs'
    commandLine 'docker-compose', '-f', 'docker-compose.dev.yml', 'logs', '-f'
}