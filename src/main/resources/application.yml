spring:
  # Database
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/kioku_db}

  # Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

# Logging
logging:
  level:
    root: INFO
    com.kioku.api: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# JWT Configuration - NO FALLBACK (fail fast if not set)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Server
server:
  port: ${PORT:8080}