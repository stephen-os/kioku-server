spring:
  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

# Logging - DEBUG enabled
logging:
  level:
    root: INFO
    com.kioku.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT Configuration - NO FALLBACK (fail fast if not set)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Server
server:
  port: ${PORT:8080}
