spring:
  # Real Postgres via Testcontainers, matching the version in
  # docker-compose.yml. The jdbc:tc: URL starts and reuses a container for the
  # test JVM, so no per-test setup code is needed.
  #
  # Tests run against the database we actually ship. H2 could not represent
  # uuid[] or GIN indexes, and generated its schema from the entities, which
  # meant schema.sql was never exercised by a single test.
  datasource:
    url: jdbc:tc:postgresql:15:///kioku
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  # schema.sql is authoritative in tests too, so entity drift fails CI rather
  # than production startup.
  sql:
    init:
      mode: always

  # @DataJpaTest swaps in an embedded database by default. There is no longer
  # one on the classpath, and the point is to test against real Postgres.
  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Logging
logging:
  level:
    root: WARN
    com.kioku.api: INFO
    org.hibernate.SQL: WARN

# JWT Configuration
jwt:
  secret: test-secret-key-that-is-long-enough-for-jwt-signing-algorithm-256-bits
  expiration: 86400000
