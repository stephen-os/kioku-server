spring:
  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  # H2 Console
  h2:
    console:
      enabled: true

# Logging
logging:
  level:
    root: WARN
    com.kioku.api: INFO
    org.hibernate.SQL: WARN

# JWT Configuration
jwt:
  secret: test-secret-key-that-is-long-enough-for-jwt-signing-algorithm-256-bits
  expiration: 86400000
