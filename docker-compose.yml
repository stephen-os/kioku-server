services:
  postgres:
    image: postgres:15
    container_name: kioku-postgres
    environment:
      POSTGRES_DB: kioku_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kioku_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: kioku-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kioku_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 123
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
    driver: local